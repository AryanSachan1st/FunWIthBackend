<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="color">
    <button id = "green">Green Me</button>
    <button id = "red">Red Me</button>
</body>
<script>
    function changeTheme(inpId) {
        const inputBox = document.querySelector(inpId)
        inputBox.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                const color = event.target.value;
                document.body.style.backgroundColor = color
            }
        })
    }

    function dynamicTheme(inpId) {
        const inputBox = document.querySelector(inpId)
        inputBox.addEventListener("input", (event) => {
            const color = event.target.value;
            document.body.style.backgroundColor = color
        })
    }
    // changeTheme("#color")
    dynamicTheme("#color")

    // Lexical Scoping and Closure
    function clickHandler(color) {
        return function() {
            document.body.style.backgroundColor = `${color}`
        }
    }
    document.querySelector("#red").onclick = clickHandler("red")
    document.querySelector("#green").onclick = clickHandler("green")
    /*
    Closure: When a function “remembers” variables from its creation environment, even after that outer function has finished.
    */
</script>
</html>
